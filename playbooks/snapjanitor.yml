---
# Usage:
#   export VCENTER_HOST=... VCENTER_USER=... VCENTER_PASSWORD=...
#   ansible-playbook playbooks/snapjanitor.yml -e hostnames_file=hostnames.txt            # dry run
#   ansible-playbook playbooks/snapjanitor.yml -e hostnames_file=hostnames.txt -e remove=true
- name: Snapjanitor - list/remove VM snapshots by ESXi host
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hostnames_file: hostnames.txt
    remove: false
  environment:
    VCENTER_HOST: "{{ lookup('env', 'VCENTER_HOST') }}"
    VCENTER_USER: "{{ lookup('env', 'VCENTER_USER') }}"
    VCENTER_PASSWORD: "{{ lookup('env', 'VCENTER_PASSWORD') }}"
  tasks:
    - name: Install requirements
      ansible.builtin.pip:
        requirements: "{{ playbook_dir }}/../requirements.txt"

    - name: Run snapjanitor
      ansible.builtin.command:
        argv: >-
          {{ ['python3', playbook_dir ~ '/../scripts/snapjanitor.py',
              '--hostnames-file', hostnames_file]
              + (['--yes'] if remove | bool else ['--dry-run']) }}
      no_log: true
      register: result
      changed_when: remove | bool

    - name: Show output
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
